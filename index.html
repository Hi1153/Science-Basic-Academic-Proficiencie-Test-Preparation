<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f6f8">
<title>理科 基礎学力テスト対策</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f3f4f6;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd}
.header-inner{max-width:900px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-weight:700;font-size:18px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.main{max-width:900px;margin:auto;padding:18px 14px 110px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;margin-bottom:14px;padding:18px;box-shadow:0 1px 3px #0000000a}
.start{text-align:center;padding:34px 18px}
h1{font-size:25px;margin:0 0 8px}
h2{font-size:18px;margin:0 0 12px}
p{line-height:1.7}
.info{background:#f7f8fa;border-radius:10px;padding:14px;text-align:left;font-size:14px;line-height:1.8}
.primary,.secondary,.danger{border:0;border-radius:9px;padding:12px 18px;font-weight:700}
.primary{background:#1a73e8;color:#fff}
.secondary{background:#eef1f5;color:#202124}
.danger{background:#d93025;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.hidden{display:none!important}
.progress-wrap{background:#e1e4e8;height:7px;border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress{height:100%;background:#1a73e8;width:0%;transition:.2s}
.question-number{font-size:13px;color:#666;margin-bottom:7px}
.question-text{font-size:17px;font-weight:700;line-height:1.7;margin-bottom:15px}
.short-input{width:100%;padding:14px;border:1px solid #c8ccd1;border-radius:8px;outline:none;background:#fff;font-size:17px}
.short-input:focus{border-color:#1a73e8;box-shadow:0 0 0 2px #1a73e822}
.nav{display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:10px;z-index:5}
.nav button{flex:1}
.question-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.q-dot{border:1px solid #ccd0d5;background:#fff;border-radius:7px;height:34px;cursor:pointer;font-size:12px}
.q-dot.answered{background:#eaf2ff;border-color:#1a73e8;color:#135db8}
.q-dot.current{box-shadow:0 0 0 2px #1a73e8 inset;font-weight:700}
.result-score{text-align:center;font-size:44px;font-weight:800;margin:15px 0 4px}
.result-sub{text-align:center;color:#666}
.answer-row{border-top:1px solid #ddd;padding:14px 0;line-height:1.7}
.correct{color:#188038;font-weight:700}
.incorrect{color:#d93025;font-weight:700}
.answer{margin-top:6px;padding:9px 11px;background:#f7f8fa;border-radius:7px}
.category{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#eef1f5;color:#555;margin-bottom:9px}
.retry-info{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:13px;font-size:14px;line-height:1.7;margin-top:14px}
.stat{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.stat span{background:#f7f8fa;border-radius:8px;padding:7px 10px;font-size:13px}
@media(max-width:600px){
.main{padding:12px 10px 100px}
.card{padding:15px}
.question-text{font-size:16px}
.question-grid{grid-template-columns:repeat(8,1fr)}
.q-dot{height:32px}
.header-inner{padding:11px 12px}
.title{font-size:16px}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">
<div class="title">理科 基礎学力テスト対策</div>
<div id="timer" class="timer">45:00</div>
</div>
</header>

<main class="main">

<section id="startScreen" class="card start">

<h1>理科 基礎学力テスト対策</h1>

<p>中学1・2年生の総復習<br>生物・化学・物理・地学</p>

<div class="info">
<b>テストについて</b><br>
・全100問<br>
・中学1・2年生の内容<br>
・制限時間 45分<br>
・全問入力式
</div>

<div class="stat">
<span>生物 25問</span>
<span>化学 25問</span>
<span>物理 25問</span>
<span>地学 25問</span>
</div>

<div class="actions">
<button class="primary" onclick="startTest()">テストを開始</button>
</div>

<div id="retryArea"></div>

</section>

<section id="testScreen" class="hidden">

<div class="card">

<div class="progress-wrap">
<div id="progress" class="progress"></div>
</div>

<div id="question"></div>

</div>

<div class="card">
<div style="font-weight:700;margin-bottom:10px">問題一覧</div>
<div id="questionGrid" class="question-grid"></div>
</div>

<div class="nav">
<button id="prevBtn" class="secondary" onclick="prevQuestion()">← 前の問題</button>
<button id="nextBtn" class="primary" onclick="nextQuestion()">次の問題 →</button>
</div>

</section>

<section id="resultScreen" class="hidden">

<div class="card">

<h2 style="text-align:center">テスト結果</h2>

<div id="score" class="result-score">0 / 100</div>
<div id="percentage" class="result-sub">0%</div>
<div id="resultMessage" style="text-align:center;margin-top:15px;font-weight:700"></div>

<div id="retryResultArea"></div>

<div class="actions">
<button class="primary" onclick="showAnswers()">正答・解説を見る</button>
<button class="secondary" onclick="location.reload()">もう一度受ける</button>
</div>

</div>

<div id="answerScreen" class="card hidden">
<h2>正答・解説</h2>
<div id="answers"></div>
</div>

</section>

</main>

<script>

const questions=[

/* =========================
   生物 25問
========================= */

{c:"生物",q:"植物のからだで、光合成を行う細胞小器官は何か。",a:["葉緑体","ようりょくたい"],e:"葉緑体で光合成が行われます。"},

{c:"生物",q:"植物が光合成によってつくる養分は何か。",a:["デンプン","でんぷん"],e:"光合成によってデンプンなどの養分がつくられます。"},

{c:"生物",q:"光合成に必要な気体は何か。",a:["二酸化炭素","にさんかたんそ"],e:"植物は二酸化炭素と水を使って光合成を行います。"},

{c:"生物",q:"光合成によって放出される気体は何か。",a:["酸素","さんそ"],e:"光合成では酸素が放出されます。"},

{c:"生物",q:"植物の根の先端近くにあり、水や無機物を吸収する細い部分を何というか。",a:["根毛","こんもう"],e:"根毛は土の中から水や無機物を吸収します。"},

{c:"生物",q:"植物の体内で水や無機物を運ぶ管を何というか。",a:["道管","どうかん"],e:"道管は根から吸収した水や無機物を運びます。"},

{c:"生物",q:"植物の体内で葉でつくられた養分を運ぶ管を何というか。",a:["師管","しかん"],e:"師管は葉でつくられた養分を運びます。"},

{c:"生物",q:"植物の葉の表面にあり、気体の出入りを行う小さな穴を何というか。",a:["気孔","きこう"],e:"気孔は二酸化炭素や酸素、水蒸気などの出入りに関係します。"},

{c:"生物",q:"植物が根から水を吸収し、体内の水を水蒸気として放出する現象を何というか。",a:["蒸散","じょうさん"],e:"葉などから水蒸気を放出する現象を蒸散といいます。"},

{c:"生物",q:"花のつくりで、花粉がつくられる部分を何というか。",a:["やく","葯"],e:"おしべの先端にあるやくで花粉がつくられます。"},

{c:"生物",q:"花のつくりで、花粉がつく部分を何というか。",a:["柱頭","ちゅうとう"],e:"めしべの先端にある柱頭に花粉がつきます。"},

{c:"生物",q:"受精後、種子になる部分は何か。",a:["胚珠","はいしゅ"],e:"受精後、胚珠は種子になります。"},

{c:"生物",q:"受精後、果実になる部分は何か。",a:["子房","しぼう"],e:"受精後、子房は果実になります。"},

{c:"生物",q:"動物の細胞で、遺伝情報を含む部分は何か。",a:["核","かく"],e:"核には遺伝情報を含む染色体があります。"},

{c:"生物",q:"細胞の外側を囲み、細胞の内外を隔てている膜を何というか。",a:["細胞膜","さいぼうまく"],e:"細胞膜は細胞の内外を隔てています。"},

{c:"生物",q:"細胞の中で生命活動に必要なエネルギーを取り出す場所を何というか。",a:["ミトコンドリア"],e:"ミトコンドリアでは呼吸によってエネルギーが取り出されます。"},

{c:"生物",q:"動物が酸素を取り入れ、二酸化炭素を出すはたらきを何というか。",a:["呼吸","こきゅう"],e:"細胞では呼吸によって養分からエネルギーを取り出します。"},

{c:"生物",q:"血液中で酸素を運ぶはたらきをする血球は何か。",a:["赤血球","せっけっきゅう"],e:"赤血球のヘモグロビンが酸素を運びます。"},

{c:"生物",q:"血液を全身に送り出す器官は何か。",a:["心臓","しんぞう"],e:"心臓は血液を送り出すポンプのようなはたらきをします。"},

{c:"生物",q:"心臓から送り出された血液が流れる血管を何というか。",a:["動脈","どうみゃく"],e:"心臓から出ていく血液は動脈を流れます。"},

{c:"生物",q:"心臓へ戻ってくる血液が流れる血管を何というか。",a:["静脈","じょうみゃく"],e:"心臓へ戻る血液は静脈を流れます。"},

{c:"生物",q:"食物を消化し、栄養分を吸収する主な器官は何か。",a:["小腸","しょうちょう"],e:"小腸では消化された栄養分が吸収されます。"},

{c:"生物",q:"デンプンを分解する消化酵素を含むだ液を出す器官は何か。",a:["だ液腺","唾液腺","だえきせん"],e:"だ液にはデンプンを分解する消化酵素が含まれます。"},

{c:"生物",q:"血液中の不要な物質をこし取り、尿をつくる器官は何か。",a:["腎臓","じんぞう"],e:"腎臓は血液から不要な物質などを取り除き尿をつくります。"},

{c:"生物",q:"刺激に対して反応するための神経のうち、脳やせきずいからなる部分を何というか。",a:["中枢神経","ちゅうすうしんけい"],e:"脳とせきずいを合わせて中枢神経といいます。"},

/* =========================
   化学 25問
========================= */

{c:"化学",q:"物質をつくっている基本的な粒子を何というか。",a:["原子","げんし"],e:"物質は原子などの粒子からできています。"},

{c:"化学",q:"原子がいくつか結びついてできた粒子を何というか。",a:["分子","ぶんし"],e:"分子は複数の原子が結びついてできることがあります。"},

{c:"化学",q:"酸素の化学式は何か。",a:["O2","o2"],e:"酸素分子は酸素原子2個からできています。"},

{c:"化学",q:"水素の化学式は何か。",a:["H2","h2"],e:"水素分子は水素原子2個からできています。"},

{c:"化学",q:"水の化学式は何か。",a:["H2O","h2o"],e:"水は水素原子2個と酸素原子1個からできています。"},

{c:"化学",q:"二酸化炭素の化学式は何か。",a:["CO2","co2"],e:"二酸化炭素は炭素原子1個と酸素原子2個からできています。"},

{c:"化学",q:"酸素の中で物質が激しく結びつく化学変化を何というか。",a:["燃焼","ねんしょう"],e:"酸素と結びつきながら激しく反応することを燃焼といいます。"},

{c:"化学",q:"物質が酸素と結びつく化学変化を何というか。",a:["酸化","さんか"],e:"酸素と結びつく化学変化を酸化といいます。"},

{c:"化学",q:"酸化物から酸素を取り除く化学変化を何というか。",a:["還元","かんげん"],e:"酸化物から酸素が取り除かれる変化を還元といいます。"},

{c:"化学",q:"鉄と硫黄を加熱するとできる物質は何か。",a:["硫化鉄","りゅうかてつ"],e:"鉄と硫黄が化合して硫化鉄になります。"},

{c:"化学",q:"鉄と硫黄が化合してできる物質の化学式は何か。",a:["FeS","fes"],e:"硫化鉄はFeSで表されます。"},

{c:"化学",q:"物質が水に溶けて透明な液体になったものを何というか。",a:["水溶液","すいようえき"],e:"物質が水に溶けた液体を水溶液といいます。"},

{c:"化学",q:"水溶液に溶けている物質を何というか。",a:["溶質","ようしつ"],e:"水に溶けている物質が溶質です。"},

{c:"化学",q:"溶質を溶かしている液体を何というか。",a:["溶媒","ようばい"],e:"溶質を溶かしている物質が溶媒です。"},

{c:"化学",q:"一定量の水に物質がそれ以上溶けなくなった水溶液を何というか。",a:["飽和水溶液","ほうわすいようえき"],e:"それ以上溶質が溶けない状態を飽和といいます。"},

{c:"化学",q:"物質が水に溶けている量を表す割合を何というか。",a:["濃度","のうど"],e:"水溶液の濃さを濃度で表します。"},

{c:"化学",q:"酸性の水溶液に青色リトマス紙をつけると何色になるか。",a:["赤","あか"],e:"酸性では青色リトマス紙が赤色になります。"},

{c:"化学",q:"アルカリ性の水溶液に赤色リトマス紙をつけると何色になるか。",a:["青","あお"],e:"アルカリ性では赤色リトマス紙が青色になります。"},

{c:"化学",q:"酸性・アルカリ性の程度を表す数値を何というか。",a:["pH","ph"],e:"pHは水溶液の酸性・アルカリ性の程度を表します。"},

{c:"化学",q:"pHが7の水溶液は何性か。",a:["中性","ちゅうせい"],e:"25℃付近ではpH7が中性です。"},

{c:"化学",q:"酸性の水溶液とアルカリ性の水溶液を混ぜて互いの性質を打ち消す反応を何というか。",a:["中和","ちゅうわ"],e:"酸とアルカリが反応して互いの性質を打ち消します。"},

{c:"化学",q:"中和によってできる、酸の陰イオンとアルカリの陽イオンからなる物質を何というか。",a:["塩","えん"],e:"中和では水とともに塩ができます。"},

{c:"化学",q:"酸化銀を加熱したときにできる2つの物質のうち、銀以外の気体は何か。",a:["酸素","さんそ"],e:"酸化銀を加熱すると銀と酸素に分解します。"},

{c:"化学",q:"1種類の物質が2種類以上の物質に分かれる化学変化を何というか。",a:["分解","ぶんかい"],e:"1種類の物質から複数の物質ができる変化を分解といいます。"},

{c:"化学",q:"水を電気分解すると発生する2種類の気体は何か。",a:["水素と酸素","すいそとさんそ"],e:"水は水素と酸素に分解されます。"},

/* =========================
   物理 25問
========================= */

{c:"物理",q:"物体が動く速さを表す量を何というか。",a:["速さ","はやさ"],e:"速さは単位時間あたりに進む距離です。"},

{c:"物理",q:"速さを求める公式を答えよ。",a:["道のり÷時間","道のり/時間","みちのり÷じかん"],e:"速さ＝道のり÷時間です。"},

{c:"物理",q:"力の大きさを表す単位は何か。",a:["N","n","ニュートン"],e:"力の単位にはニュートン（N）を使います。"},

{c:"物理",q:"物体にはたらく重力の大きさを何というか。",a:["重さ","おもさ"],e:"重力の大きさを重さといいます。"},

{c:"物理",q:"物体そのものの量を表し、場所が変わっても変化しないものは何か。",a:["質量","しつりょう"],e:"質量は物体そのものの量です。"},

{c:"物理",q:"力の大きさを測定する器具を何というか。",a:["ばねばかり","バネばかり"],e:"ばねの伸びを利用して力を測定します。"},

{c:"物理",q:"物体に力がはたらくとき、力の向きと反対向きにはたらく力を何というか。",a:["摩擦力","まさつりょく"],e:"接触面では運動を妨げる向きに摩擦力がはたらきます。"},

{c:"物理",q:"物体が水や空気などから受ける上向きの力を何というか。",a:["浮力","ふりょく"],e:"液体や気体中の物体には浮力がはたらきます。"},

{c:"物理",q:"ばねに加える力を大きくすると、ばねの伸びはどうなるか。",a:["大きくなる","おおきくなる"],e:"一定の範囲では力が大きいほどばねの伸びも大きくなります。"},

{c:"物理",q:"光が鏡などの面に当たってはね返る現象を何というか。",a:["反射","はんしゃ"],e:"光が物体の表面ではね返る現象が反射です。"},

{c:"物理",q:"鏡に入る光と鏡の面に垂直な線がつくる角を何というか。",a:["入射角","にゅうしゃかく"],e:"入射光と法線の間の角が入射角です。"},

{c:"物理",q:"光が空気中から水中などへ進むとき、進む向きが変わる現象を何というか。",a:["屈折","くっせつ"],e:"異なる物質の境界で光の進む向きが変わります。"},

{c:"物理",q:"凸レンズで、レンズの中心を通り光軸に平行な線を何というか。",a:["光軸","こうじく"],e:"レンズの中心を通る基準となる軸です。"},

{c:"物理",q:"凸レンズに平行に入った光が集まる点を何というか。",a:["焦点","しょうてん"],e:"凸レンズでは平行光線が焦点に集まります。"},

{c:"物理",q:"音を伝えるものを何というか。",a:["媒質","ばいしつ"],e:"音は空気や水、固体などの媒質を通って伝わります。"},

{c:"物理",q:"音の高さは、音源の何によって決まるか。",a:["振動数","しんどうすう"],e:"振動数が多いほど音は高くなります。"},

{c:"物理",q:"音の大きさは、音源の振動の何によって決まるか。",a:["振幅","しんぷく"],e:"振幅が大きいほど音は大きくなります。"},

{c:"物理",q:"電流の単位は何か。",a:["A","a","アンペア"],e:"電流の単位はアンペア（A）です。"},

{c:"物理",q:"電圧の単位は何か。",a:["V","v","ボルト"],e:"電圧の単位はボルト（V）です。"},

{c:"物理",q:"電気抵抗の単位は何か。",a:["Ω","オーム","ohm"],e:"電気抵抗の単位はオーム（Ω）です。"},

{c:"物理",q:"電圧・電流・抵抗の関係を表す法則を何というか。",a:["オームの法則","おーむのほうそく"],e:"電圧＝電流×抵抗という関係です。"},

{c:"物理",q:"電流を測定する器具を何というか。",a:["電流計","でんりゅうけい"],e:"電流計は回路に直列につなぎます。"},

{c:"物理",q:"電圧を測定する器具を何というか。",a:["電圧計","でんあつけい"],e:"電圧計は測定する部分に並列につなぎます。"},

{c:"物理",q:"電流が流れる道筋を何というか。",a:["回路","かいろ"],e:"電流が流れる一続きの道筋を回路といいます。"},

{c:"物理",q:"電流が枝分かれしない回路を何というか。",a:["直列回路","ちょくれつかいろ"],e:"電流の通り道が1本の回路です。"},

/* =========================
   地学 25問
========================= */

{c:"地学",q:"地球を取り巻く気体の層を何というか。",a:["大気","たいき"],e:"地球を取り巻く気体の層を大気といいます。"},

{c:"地学",q:"空気中に最も多く含まれている気体は何か。",a:["窒素","ちっそ"],e:"大気の約78％が窒素です。"},

{c:"地学",q:"空気中に約21％含まれている気体は何か。",a:["酸素","さんそ"],e:"酸素は大気の約21％を占めます。"},

{c:"地学",q:"水蒸気が冷やされて水滴になることを何というか。",a:["凝結","ぎょうけつ"],e:"水蒸気が冷やされて液体の水になる変化です。"},

{c:"地学",q:"暖かい空気が冷たい空気の上にはい上がる前線を何というか。",a:["温暖前線","おんだんぜんせん"],e:"温暖前線では暖気が寒気の上にゆるやかに上昇します。"},

{c:"地学",q:"寒気が暖気を押し上げる前線を何というか。",a:["寒冷前線","かんれいぜんせん"],e:"寒冷前線では寒気が暖気の下にもぐり込みます。"},

{c:"地学",q:"太陽系で太陽に最も近い惑星は何か。",a:["水星","すいせい"],e:"水星は太陽に最も近い惑星です。"},

{c:"地学",q:"太陽系で地球のすぐ外側を回る惑星は何か。",a:["火星","かせい"],e:"火星は地球の外側を公転しています。"},

{c:"地学",q:"月が太陽の光を反射して輝いて見えることを何というか。",a:["月の満ち欠け","つきのみちかけ"],e:"月は太陽光を反射して輝いています。"},

{c:"地学",q:"太陽の表面に見られる黒い斑点を何というか。",a:["黒点","こくてん"],e:"黒点は周囲より温度が低いため黒く見えます。"},

{c:"地学",q:"地球内部の高温でどろどろにとけた物質を何というか。",a:["マグマ"],e:"地下にある高温の溶融した岩石をマグマといいます。"},

{c:"地学",q:"地下の岩石が強い力を受けて割れたりずれたりすることを何というか。",a:["断層","だんそう"],e:"地層や岩盤がずれてできた境界を断層といいます。"},

{c:"地学",q:"地震が発生した地下の場所を何というか。",a:["震源","しんげん"],e:"地震が発生した地下の地点を震源といいます。"},

{c:"地学",q:"震源の真上の地表の地点を何というか。",a:["震央","しんおう"],e:"震源の真上にある地表の地点を震央といいます。"}

];

let current=0;
let activeQuestions=[];
let userAnswers=[];
let retryMode=false;
let submitted=false;
let timeLeft=45*60;
let timerId=null;

if(questions.length!==100){
alert("問題数エラー："+questions.length+"問");
}

function normalizeText(v){
return String(v)
.trim()
.toLowerCase()
.normalize("NFKC")
.replace(/[ \t\r\n　]/g,"")
.replace(/[・･,，。．、\-ー―‐−]/g,"")
.replace(/[ぁ-ゖ]/g,m=>String.fromCharCode(m.charCodeAt(0)+0x60));
}

function isCorrect(q,index){
const input=normalizeText(userAnswers[index]||"");
if(!input)return false;
return q.a.some(ans=>normalizeText(ans)===input);
}

function escapeHtml(v){
return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function getWrong(){
try{
const x=JSON.parse(localStorage.getItem("scienceTestWrong")||"[]");
return Array.isArray(x)?x:[];
}catch(e){
return [];
}
}

function saveWrong(x){
localStorage.setItem("scienceTestWrong",JSON.stringify(x));
}

function startTest(){
retryMode=false;
activeQuestions=[...questions];
userAnswers=new Array(activeQuestions.length).fill("");
current=0;
submitted=false;
timeLeft=45*60;
openTest();
}

function startRetry(){

const wrong=getWrong();

if(!wrong.length){
alert("再テストできる問題はありません。");
return;
}

activeQuestions=wrong.map(i=>questions[i]).filter(Boolean);

retryMode=true;
userAnswers=new Array(activeQuestions.length).fill("");
current=0;
submitted=false;

timeLeft=Math.min(
45*60,
Math.max(5*60,activeQuestions.length*60)
);

openTest();
}

function openTest(){

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("testScreen").classList.remove("hidden");
document.getElementById("resultScreen").classList.add("hidden");

buildGrid();
showQuestion();
updateTimer();

if(timerId)clearInterval(timerId);

timerId=setInterval(()=>{

timeLeft--;

if(timeLeft<=0){
timeLeft=0;
updateTimer();
clearInterval(timerId);
timerId=null;
submitTest(true);
return;
}

updateTimer();

},1000);

window.scrollTo({top:0,behavior:"smooth"});
}

function updateTimer(){

const m=Math.floor(timeLeft/60);
const s=timeLeft%60;

document.getElementById("timer").textContent=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

document.getElementById("timer").style.color=
timeLeft<=300?"#d93025":"#333";
}

function buildGrid(){

const grid=document.getElementById("questionGrid");

grid.innerHTML="";

activeQuestions.forEach((q,i)=>{

const b=document.createElement("button");

b.className="q-dot";
b.textContent=i+1;

b.onclick=()=>{
current=i;
showQuestion();
};

grid.appendChild(b);

});
}

function updateGrid(){

document.querySelectorAll(".q-dot").forEach((b,i)=>{

b.classList.toggle("current",i===current);

b.classList.toggle(
"answered",
String(userAnswers[i]||"").trim()!==""
);

});
}

function showQuestion(){

const q=activeQuestions[current];

if(!q)return;

document.getElementById("progress").style.width=
((current+1)/activeQuestions.length*100)+"%";

document.getElementById("question").innerHTML=`

<div class="category">${escapeHtml(q.c)}</div>

<div class="question-number">
問題 ${current+1} / ${activeQuestions.length}
</div>

<div class="question-text">${escapeHtml(q.q)}</div>

<input
id="shortInput"
class="short-input"
type="text"
inputmode="text"
autocomplete="off"
placeholder="答えを入力してください"
value="${escapeHtml(userAnswers[current]||"")}"
>

`;

const input=document.getElementById("shortInput");

input.oninput=function(){
setAnswer(this.value);
};

input.onkeydown=function(e){
if(e.key==="Enter"){
e.preventDefault();
if(current===activeQuestions.length-1){
submitTest();
}else{
nextQuestion();
}
}
};

document.getElementById("prevBtn").disabled=current===0;

const next=document.getElementById("nextBtn");

if(current===activeQuestions.length-1){

next.textContent="提出する";
next.className="danger";
next.onclick=submitTest;

}else{

next.textContent="次の問題 →";
next.className="primary";
next.onclick=nextQuestion;

}

updateGrid();
}

function setAnswer(v){
userAnswers[current]=v;
updateGrid();
}

function prevQuestion(){

if(current<=0)return;

current--;
showQuestion();

window.scrollTo({top:0,behavior:"smooth"});
}

function nextQuestion(){

if(current<activeQuestions.length-1){

current++;
showQuestion();

window.scrollTo({top:0,behavior:"smooth"});
}
}

function submitTest(force=false){

if(submitted)return;

if(!force){

const unanswered=userAnswers.filter(v=>!String(v).trim()).length;

if(unanswered){

if(!confirm(
`未回答の問題が ${unanswered} 問あります。\nこのまま提出しますか？`
))return;

}
}

submitted=true;

if(timerId){
clearInterval(timerId);
timerId=null;
}

let score=0;

activeQuestions.forEach((q,i)=>{
if(isCorrect(q,i))score++;
});

let wrong=[];

activeQuestions.forEach((q,i)=>{

if(!isCorrect(q,i)){

const originalIndex=questions.indexOf(q);

if(originalIndex>=0){
wrong.push(originalIndex);
}

}

});

saveWrong(wrong);

document.getElementById("testScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

const percent=Math.round(score/activeQuestions.length*100);

document.getElementById("score").textContent=
`${score} / ${activeQuestions.length}`;

document.getElementById("percentage").textContent=
`${percent}%`;

let message="";

if(percent===100){
message="満点！すごい！";
}else if(percent>=90){
message="かなりよくできています！";
}else if(percent>=80){
message="あと少しでかなり強いです！";
}else if(percent>=60){
message="ここから復習すれば伸ばせます！";
}else{
message="間違えた問題を中心に復習しよう！";
}

if(retryMode&&percent===100){
message="前回の間違いを全部克服しました！🎉";
}

document.getElementById("resultMessage").textContent=message;

renderRetryResult();

window.scrollTo({top:0,behavior:"smooth"});
}

function renderRetryResult(){

const wrong=getWrong();
const area=document.getElementById("retryResultArea");

if(!wrong.length){

area.innerHTML=`
<div class="retry-info" style="background:#e8f5e9;border-color:#a5d6a7">
<b>間違えた問題はありません！</b><br>
弱点克服完了です！
</div>
`;

return;
}

const counts={
生物:0,
化学:0,
物理:0,
地学:0
};

wrong.forEach(i=>{
if(questions[i])counts[questions[i].c]++;
});

area.innerHTML=`
<div class="retry-info">
まだ間違えている問題：<b>${wrong.length}問</b><br>
生物：${counts.生物}問　
化学：${counts.化学}問　
物理：${counts.物理}問　
地学：${counts.地学}問
</div>

<div class="actions">
<button class="danger" onclick="startRetry()">
間違えた問題を再テスト
</button>
</div>
`;
}

function showAnswers(){

const box=document.getElementById("answerScreen");
const list=document.getElementById("answers");

box.classList.remove("hidden");

let html="";

activeQuestions.forEach((q,i)=>{

const correct=isCorrect(q,i);
const user=userAnswers[i]||"未回答";

html+=`
<div class="answer-row">

<b>${i+1}. ${escapeHtml(q.q)}</b>

<div class="${correct?"correct":"incorrect"}">
${correct?"○ 正解":"× 不正解"}
</div>

<div>
あなたの答え：${escapeHtml(user)}
</div>

<div class="answer">
正解：<b>${escapeHtml(q.a[0])}</b><br>
<span style="color:#666;font-size:14px">
${escapeHtml(q.e)}
</span>
</div>

</div>
`;
});

list.innerHTML=html;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
}

function renderStartRetry(){

const wrong=getWrong();
const area=document.getElementById("retryArea");

if(!wrong.length){
area.innerHTML="";
return;
}

const counts={
生物:0,
化学:0,
物理:0,
地学:0
};

wrong.forEach(i=>{
if(questions[i])counts[questions[i].c]++;
});

area.innerHTML=`
<div class="retry-info">
前回の間違い：<b>${wrong.length}問</b><br>
生物：${counts.生物}問　
化学：${counts.化学}問　
物理：${counts.物理}問　
地学：${counts.地学}問
</div>

<div class="actions">
<button class="danger" onclick="startRetry()">
間違えた問題を再テスト
</button>
</div>
`;
}

renderStartRetry();

</script>

</body>
</html>
